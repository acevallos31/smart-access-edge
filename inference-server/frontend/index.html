<!DOCTYPE html>
<html>
<head>
    <title>Smart Access Edge</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        img {
            width: 640px;
            border: 2px solid #444;
        }

        #events {
            margin-top: 20px;
            background: #222;
            padding: 10px;
            border-radius: 10px;
        }

        .event {
            margin-bottom: 10px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Smart Access Edge</h1>

    <h2>Entrada Principal</h2>

    <img
        id="snapshot"
        src="https://inference-api.nocpbx.com/snapshot/entrada01"
    >

    <div id="events">
        <h2>Eventos</h2>
    </div>

    <script>

        function reloadSnapshot() {

            const img = document.getElementById("snapshot");

            img.src =
                "https://inference-api.nocpbx.com/snapshot/entrada01?t="
                + new Date().getTime();
        }

        setInterval(reloadSnapshot, 1000);

        const ws = new WebSocket(
            "wss://inference-api.nocpbx.com/ws/events"
        );

        ws.onopen = () => {
            console.log("WebSocket conectado");
        };

        ws.onmessage = (event) => {

            const data = JSON.parse(event.data);

            console.log("Evento:", data);

            const div = document.createElement("div");

            div.className = "event";

            div.innerHTML = `
                <b>Cámara:</b> ${data.cameraName}<br>
                <b>Evento:</b> ${data.eventType}<br>
                <b>Personas:</b> ${data.persons}<br>
                <b>Hora:</b> ${data.timestamp}<br>
                <img src="${data.snapshotUrl}" width="300">
            `;

            document
                .getElementById("events")
                .prepend(div);
        };

    </script>

</body>
</html>
