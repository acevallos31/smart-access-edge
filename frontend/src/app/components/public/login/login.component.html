<div class="login-wrapper">
  <mat-card class="premium-login-card mat-elevation-z12">

    <div class="green-banner-premium">
      <mat-icon class="banner-icon animate-spin">fingerprint</mat-icon>
      <h2>Smart Access Edge</h2>
      <p>Control de Asistencia con Inteligencia Artificial</p>
    </div>

    <mat-card-content class="form-content">
      <form (ngSubmit)="ejecutarLogin()">

        <mat-form-field appearance="outline" class="full-width solid-white-field">
          <mat-label>Correo Institucional</mat-label>
          <input matInput type="email"
                 [(ngModel)]="email"
                 name="email"
                 required
                 placeholder="ejemplo@empresa.com"
                 [disabled]="cargando">
          <mat-icon matSuffix class="animate-pulse">mail_lock</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width solid-white-field">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password"
                 [(ngModel)]="password"
                 name="password"
                 required
                 [disabled]="cargando">
          <mat-icon matSuffix class="animate-shake">vpn_key</mat-icon>
        </mat-form-field>

        <!-- Mensaje de error -->
        <div *ngIf="errorMessage" class="error-message">
          <mat-icon class="error-icon">error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Botón con spinner de carga -->
        <button mat-raised-button class="btn-login-premium" type="submit" [disabled]="cargando">
          <mat-spinner *ngIf="cargando" diameter="20" class="spinner-btn"></mat-spinner>
          <span *ngIf="!cargando">Ingresar al Sistema</span>
          <span *ngIf="cargando">Verificando...</span>
          <mat-icon *ngIf="!cargando">login</mat-icon>
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
